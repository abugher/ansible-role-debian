source_url:                     'https://deb.debian.org/debian'
source_suites:                  
  - "{{ os_release_name }}"
  - "{{ os_release_name }}-updates"
  - "{{ os_release_name }}-backports"
# debian-security is not available at the same domain as the other suites.
security_source_url:            'https://security.debian.org/debian-security'
security_source_suites:
  - "{{ os_release_name }}-security"
source_components:
  - 'main'
  - 'contrib'
  - 'non-free'
  - 'non-free-firmware'
keyring_file:                   '/usr/share/keyrings/debian-archive-keyring.gpg'
template_files:
  - owner:                      'root'
    group:                      'root'
    mode:                       '0644'
    src:                        'templates/conf/sources.list.d/sources.j2'
    dest:                       "/etc/apt/sources.list.d/debian_{{ os_release_name }}.sources"
